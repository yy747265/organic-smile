<!DOCTYPE html>
<html lang="ar" dir="rtl" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>المنتج | ORGANIC Smile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        body { background: #0a0a0a; color: #f4f1ea; }
        .pp-main { max-width: 1100px; margin: 0 auto; padding: 110px 5% 70px; font-family: 'Tajawal', 'Poppins', sans-serif; }
        body.en .pp-main { font-family: 'Poppins', 'Tajawal', sans-serif; }

        .pp-crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; color: #9b9686; margin-bottom: 26px; }
        .pp-crumbs a { color: #C9A961; text-decoration: none; }
        .pp-crumbs a:hover { text-decoration: underline; }

        .pp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start; }

        .pp-gallery-main { background: #151513; border: 1px solid rgba(201,169,97,.22); border-radius: 20px; overflow: hidden; aspect-ratio: 1 / 1; cursor: zoom-in; }
        .pp-gallery-main img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .pp-thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .pp-thumbs button { width: 72px; height: 72px; padding: 0; border-radius: 12px; overflow: hidden; border: 2px solid transparent; background: none; cursor: pointer; opacity: .65; transition: opacity .2s, border-color .2s; }
        .pp-thumbs button.active { border-color: #C9A961; opacity: 1; }
        .pp-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .pp-badge { display: inline-block; background: #C9A961; color: #000; font-weight: 700; font-size: 13px; padding: 3px 14px; border-radius: 999px; }
        .pp-title { font-size: 34px; font-weight: 800; line-height: 1.3; margin: 12px 0 6px; }
        .pp-desc { color: #b9b4a4; line-height: 1.9; margin: 0; }
        .pp-price { font-size: 32px; font-weight: 800; color: #C9A961; margin: 18px 0 22px; }

        .pp-label { display: block; font-weight: 700; color: #E5C78B; margin-bottom: 10px; }
        .pp-sizes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
        .pp-size { padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(201,169,97,.38); background: transparent; color: #f4f1ea; font-family: inherit; font-size: 15px; cursor: pointer; transition: background .2s, color .2s; }
        .pp-size:hover { background: rgba(201,169,97,.14); }
        .pp-size.active { background: #C9A961; color: #000; border-color: #C9A961; font-weight: 700; }

        .pp-buy { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
        .pp-qty { display: inline-flex; align-items: center; border: 1px solid rgba(201,169,97,.38); border-radius: 999px; overflow: hidden; }
        .pp-qty button { width: 44px; height: 48px; background: none; border: none; color: #C9A961; font-size: 20px; cursor: pointer; }
        .pp-qty button:hover { background: rgba(201,169,97,.14); }
        .pp-qty span { min-width: 38px; text-align: center; font-weight: 700; }
        .pp-add { flex: 1; min-width: 190px; height: 50px; border: none; border-radius: 999px; background: linear-gradient(135deg, #d9bb72, #b8924a); color: #000; font-weight: 800; font-family: inherit; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: box-shadow .2s, transform .15s; }
        .pp-add:hover { box-shadow: 0 6px 20px rgba(201,169,97,.3); }
        .pp-add:active { transform: scale(.98); }
        .pp-total { color: #9b9686; font-size: 14px; margin: 6px 0 16px; min-height: 22px; }
        .pp-wa { width: 100%; height: 50px; border-radius: 999px; border: 1px solid #25D366; background: transparent; color: #25D366; font-weight: 700; font-family: inherit; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s, color .2s; }
        .pp-wa:hover { background: #25D366; color: #fff; }

        .pp-details { margin-top: 30px; padding-top: 22px; border-top: 1px solid rgba(201,169,97,.18); }
        .pp-details h2 { font-size: 18px; color: #C9A961; margin: 0 0 14px; }
        .pp-row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px dashed rgba(201,169,97,.14); font-size: 15px; }
        .pp-row span:first-child { color: #9b9686; }
        .pp-points { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; color: #b9b4a4; }
        .pp-points i { color: #C9A961; margin-inline-end: 10px; }

        .pp-related { margin-top: 70px; }
        .pp-related h2 { font-size: 26px; color: #C9A961; margin: 0 0 22px; }
        .pp-rel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
        .pp-rel { display: block; text-decoration: none; color: inherit; background: #151513; border: 1px solid rgba(201,169,97,.2); border-radius: 16px; overflow: hidden; transition: border-color .2s, transform .2s; }
        .pp-rel:hover { border-color: #C9A961; transform: translateY(-3px); }
        .pp-rel img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
        .pp-rel div { padding: 14px; }
        .pp-rel strong { display: block; margin-bottom: 4px; }
        .pp-rel span { color: #C9A961; font-size: 14px; }

        .pp-empty { text-align: center; padding: 90px 0; color: #9b9686; }
        .pp-empty i { font-size: 46px; color: #C9A961; margin-bottom: 16px; display: block; }
        .pp-empty a { display: inline-block; margin-top: 16px; background: #C9A961; color: #000; font-weight: 700; padding: 10px 24px; border-radius: 999px; text-decoration: none; }
        .pp-foot { text-align: center; padding: 26px 5%; color: #9b9686; font-size: 14px; border-top: 1px solid rgba(201,169,97,.18); }

        .pp-main :focus-visible { outline: 2px solid #E5C78B; outline-offset: 2px; }
        @media (max-width: 800px) {
            .pp-main { padding-top: 96px; }
            .pp-grid { grid-template-columns: 1fr; gap: 26px; }
            .pp-title { font-size: 26px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body>

    <!-- شريط التنقل (نفس الموجود في الرئيسية) -->
    <header class="navbar" id="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="logo.jpg" alt="ORGANIC Smile Logo" class="logo-img" width="150" height="50" onerror="this.src='https://via.placeholder.com/150x50/0a0a0a/C9A961?text=ORGANIC+Smile'">
            </a>
        </div>
        <nav class="nav-links" id="navLinks">
            <a href="index.html" data-i18n="nav_home">الرئيسية</a>
            <a href="index.html#productsSection" data-i18n="nav_store">المتجر</a>
            <a href="index.html#offersSection" data-i18n="nav_offers">العروض</a>
            <a href="index.html#aboutSection" data-i18n="nav_story">قصتنا</a>
            <a href="index.html#usageSection" data-i18n="nav_usage">طريقة الاستخدام</a>
            <a href="index.html#contactSection" data-i18n="nav_contact">تواصل معنا</a>
        </nav>
        <div class="nav-icons">
            <button class="lang-btn" id="langBtn" aria-label="Switch Language">EN</button>
            <div class="cart-icon" id="openCartBtn" style="cursor: pointer;" aria-label="فتح سلة المشتريات">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="فتح القائمة">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <main class="pp-main" id="ppRoot"></main>

    <footer class="pp-foot">&copy; 2026 ORGANIC Smile</footer>

    <!-- نافذة السلة (نفس الموجودة في الرئيسية) -->
    <div class="cart-modal-overlay" id="cartModalOverlay">
        <div class="cart-modal">
            <div class="cart-modal-header">
                <h3><i class="fa-solid fa-bag-shopping"></i> سلة المشتريات</h3>
                <button class="close-cart-btn" id="closeCartBtn" aria-label="إغلاق السلة">&times;</button>
            </div>
            <div class="cart-modal-body" id="cartModalBody">
                <div class="empty-cart-state" id="emptyCartState" style="text-align: center; padding: 40px 20px; color: #888;">
                    <i class="fa-solid fa-basket-shopping" style="font-size: 48px; margin-bottom: 15px; color: #C9A961; opacity: 0.5;"></i>
                    <p>سلتك فارغة حالياً</p>
                    <button class="btn btn-primary" id="continueShoppingBtn" style="margin-top: 15px; width: auto; padding: 8px 20px;">تصفح المنتجات</button>
                </div>
            </div>
            <div class="cart-modal-footer" id="cartModalFooter" style="display: none;">
                <div class="checkout-form" style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 15px;">
                    <input type="text" id="clientName" placeholder="الاسم الكريم..." required autocomplete="name" style="padding: 12px; border-radius: 8px; border: 1px solid #C9A961; background: #000; color: #fff; outline: none; font-family: 'Tajawal', sans-serif;">
                    <input type="tel" id="clientPhone" placeholder="رقم الهاتف للتواصل..." required autocomplete="tel" inputmode="tel" style="padding: 12px; border-radius: 8px; border: 1px solid #C9A961; background: #000; color: #fff; outline: none; font-family: 'Tajawal', sans-serif;">
                    <textarea id="clientAddress" placeholder="عنوان التوصيل بالتفصيل (المحافظة، الشارع، رقم المبنى)..." rows="2" required autocomplete="street-address" style="padding: 12px; border-radius: 8px; border: 1px solid #C9A961; background: #000; color: #fff; outline: none; resize: none; font-family: 'Tajawal', sans-serif;"></textarea>
                </div>
                <div class="cart-total" style="width: 100%; display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px;">
                    <span>الإجمالي:</span>
                    <strong id="cartTotalPrice" style="color: #C9A961;">0 ج.م</strong>
                </div>
                <button class="checkout-btn" id="checkoutBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    إتمام الطلب عبر الواتساب <i class="fa-brands fa-whatsapp"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="image-viewer-overlay" id="imageViewerOverlay">
        <div class="image-viewer-content">
            <img src="" alt="Full size product image" id="fullSizeImage">
            <button class="close-viewer-btn" id="closeViewerBtn" aria-label="إغلاق الصورة">&times;</button>
        </div>
    </div>

    <div id="toast" class="toast">تمت العملية بنجاح</div>

    <script src="script.js"></script>
    <script src="extras.js"></script>
    <script>
        (function () {
            var T = {
                ar: {
                    cur: "ج.م", home: "الرئيسية", store: "المتجر", cat: "القسم", dried: "فواكه مجففة", powder: "بودر طبيعي",
                    size: "اختر الحجم", qty: "الكمية", total: "الإجمالي", add: "أضف إلى السلة", wa: "اطلب الآن عبر واتساب",
                    details: "تفاصيل المنتج", sizes: "الأحجام المتاحة", related: "منتجات مشابهة", from: "يبدأ من",
                    dDried: "فواكه مجففة طبيعية مختارة بعناية، مناسبة كسناك صحي أو إضافة للفطار والحلويات.",
                    dPowder: "بودر طبيعي مناسب للمشروبات والسموذي والمخبوزات والحلويات.",
                    nfT: "المنتج غير موجود", nfM: "ممكن يكون اتحذف أو الرابط غير صحيح.", back: "العودة للمتجر",
                    inc: "زيادة الكمية", dec: "تقليل الكمية", img: "عرض الصورة"
                },
                en: {
                    cur: "EGP", home: "Home", store: "Shop", cat: "Category", dried: "Dried Fruits", powder: "Natural Powder",
                    size: "Choose size", qty: "Quantity", total: "Total", add: "Add to Cart", wa: "Order now via WhatsApp",
                    details: "Product details", sizes: "Available sizes", related: "Related products", from: "From",
                    dDried: "Carefully selected natural dried fruit, perfect as a healthy snack or a topping for breakfast and desserts.",
                    dPowder: "Natural powder for drinks, smoothies, baking and desserts.",
                    nfT: "Product not found", nfM: "It may have been removed or the link is incorrect.", back: "Back to shop",
                    inc: "Increase quantity", dec: "Decrease quantity", img: "View image"
                }
            };

            var state = { sizeIdx: 0, qty: 1, imgIdx: 0 };
            var rendered = false, product = null, sizes = [], images = [];

            function lang() { return localStorage.getItem("organicLang") === "en" ? "en" : "ar"; }
            function esc(s) {
                return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
                });
            }
            function $(id) { return document.getElementById(id); }

            function render() {
                var t = T[lang()], root = $("ppRoot");
                var id = new URLSearchParams(location.search).get("id");
                var products = window.ensureProductIds ? window.ensureProductIds() : (JSON.parse(localStorage.getItem("organicProducts")) || []);
                var p = products.filter(function (x) { return x.id === id; })[0];

                if (!p) {
                    root.innerHTML = '<div class="pp-empty"><i class="fa-solid fa-box-open"></i><h2>' + t.nfT + '</h2><p>' + t.nfM + '</p><a href="index.html#productsSection">' + t.back + '</a></div>';
                    return;
                }
                if (!product || product.id !== p.id) state = { sizeIdx: 0, qty: 1, imgIdx: 0 };
                product = p;
                images = Array.isArray(p.images) && p.images.length ? p.images : [p.image || "https://via.placeholder.com/600x600/1a1a1a/C9A961?text=No+Image"];
                sizes = Array.isArray(p.sizes) && p.sizes.length ? p.sizes : [{ size: "—", price: p.price || 0 }];
                if (state.sizeIdx >= sizes.length) state.sizeIdx = 0;
                if (state.imgIdx >= images.length) state.imgIdx = 0;

                var catName = p.category === "powder" ? t.powder : t.dried;
                var desc = p.category === "powder" ? t.dPowder : t.dDried;
                var tr = (typeof translations !== "undefined" && translations[lang()]) || {};
                document.title = p.name + " | ORGANIC Smile";

                var thumbs = images.length > 1 ? '<div class="pp-thumbs">' + images.map(function (src, i) {
                    return '<button type="button" data-thumb="' + i + '" aria-label="' + t.img + ' ' + (i + 1) + '"><img src="' + esc(src) + '" alt=""></button>';
                }).join("") + '</div>' : "";

                var sizeBtns = sizes.map(function (s, i) {
                    return '<button type="button" class="pp-size" data-size="' + i + '">' + esc(s.size) + '</button>';
                }).join("");

                var sizeRows = sizes.map(function (s) {
                    return '<div class="pp-row"><span>' + esc(s.size) + '</span><span>' + esc(s.price) + ' ' + t.cur + '</span></div>';
                }).join("");

                var related = products.filter(function (x) { return x.id !== p.id && x.category === p.category; }).slice(0, 4);
                var relHtml = related.length ? '<section class="pp-related"><h2>' + t.related + '</h2><div class="pp-rel-grid">' + related.map(function (r) {
                    var rImg = (Array.isArray(r.images) && r.images[0]) || r.image || "";
                    var rSizes = Array.isArray(r.sizes) && r.sizes.length ? r.sizes : [{ price: r.price || 0 }];
                    return '<a class="pp-rel" href="product.html?id=' + encodeURIComponent(r.id) + '"><img src="' + esc(rImg) + '" alt="' + esc(r.name) + '" loading="lazy"><div><strong>' + esc(r.name) + '</strong><span>' + t.from + ' ' + esc(rSizes[0].price) + ' ' + t.cur + '</span></div></a>';
                }).join("") + '</div></section>' : "";

                root.innerHTML =
                    '<nav class="pp-crumbs" aria-label="breadcrumb"><a href="index.html">' + t.home + '</a><span>/</span><a href="index.html#productsSection">' + t.store + '</a><span>/</span><span>' + esc(p.name) + '</span></nav>' +
                    '<div class="pp-grid">' +
                        '<div><div class="pp-gallery-main" id="ppMainWrap"><img id="ppMain" src="' + esc(images[state.imgIdx]) + '" alt="' + esc(p.name) + '"></div>' + thumbs + '</div>' +
                        '<div>' +
                            '<span class="pp-badge">' + catName + '</span>' +
                            '<h1 class="pp-title">' + esc(p.name) + '</h1>' +
                            '<p class="pp-desc">' + desc + '</p>' +
                            '<div class="pp-price" id="ppPrice"></div>' +
                            '<span class="pp-label">' + t.size + '</span><div class="pp-sizes">' + sizeBtns + '</div>' +
                            '<span class="pp-label">' + t.qty + '</span>' +
                            '<div class="pp-buy">' +
                                '<div class="pp-qty"><button type="button" id="ppDec" aria-label="' + t.dec + '">&minus;</button><span id="ppQty">1</span><button type="button" id="ppInc" aria-label="' + t.inc + '">+</button></div>' +
                                '<button type="button" class="pp-add" id="ppAdd"><i class="fa-solid fa-bag-shopping"></i> ' + t.add + '</button>' +
                            '</div>' +
                            '<p class="pp-total" id="ppTotal"></p>' +
                            '<button type="button" class="pp-wa" id="ppWa"><i class="fa-brands fa-whatsapp"></i> ' + t.wa + '</button>' +
                            '<div class="pp-details"><h2>' + t.details + '</h2>' +
                                '<div class="pp-row"><span>' + t.cat + '</span><span>' + catName + '</span></div>' +
                                '<div class="pp-row"><span>' + t.sizes + '</span><span>' + sizes.length + '</span></div>' + sizeRows +
                                '<ul class="pp-points"><li><i class="fa-solid fa-leaf"></i>' + (tr.feat1 || "") + '</li><li><i class="fa-solid fa-award"></i>' + (tr.feat2 || "") + '</li><li><i class="fa-solid fa-truck-fast"></i>' + (tr.feat3 || "") + '</li></ul>' +
                            '</div>' +
                        '</div>' +
                    '</div>' + relHtml;
                refresh();
            }

            function refresh() {
                if (!product) return;
                var t = T[lang()], s = sizes[state.sizeIdx], price = Number(s.price) || 0;
                $("ppPrice").textContent = price + " " + t.cur;
                $("ppQty").textContent = state.qty;
                $("ppTotal").textContent = state.qty > 1 ? t.total + ": " + (price * state.qty) + " " + t.cur : "";
                document.querySelectorAll(".pp-size").forEach(function (b, i) { b.classList.toggle("active", i === state.sizeIdx); });
                document.querySelectorAll("[data-thumb]").forEach(function (b, i) { b.classList.toggle("active", i === state.imgIdx); });
                $("ppMain").src = images[state.imgIdx];
            }

            $("ppRoot").addEventListener("click", function (e) {
                if (!product) return;
                var el;
                if ((el = e.target.closest("[data-thumb]"))) { state.imgIdx = +el.dataset.thumb; refresh(); }
                else if ((el = e.target.closest("[data-size]"))) { state.sizeIdx = +el.dataset.size; refresh(); }
                else if (e.target.closest("#ppInc")) { state.qty = Math.min(99, state.qty + 1); refresh(); }
                else if (e.target.closest("#ppDec")) { state.qty = Math.max(1, state.qty - 1); refresh(); }
                else if (e.target.closest("#ppMainWrap")) { openImageViewer(images[state.imgIdx]); }
                else if (e.target.closest("#ppAdd")) {
                    var s = sizes[state.sizeIdx];
                    addToCartWithQty(product.name + " (" + s.size + ")", Number(s.price) || 0, images[state.imgIdx], state.qty);
                }
                else if (e.target.closest("#ppWa")) {
                    var sz = sizes[state.sizeIdx], tot = (Number(sz.price) || 0) * state.qty;
                    var msg = "🛒 *طلب من ORGANIC Smile*\n------------------------------\n📦 *" + product.name + "* (" + sz.size + ")\nالكمية: " + state.qty + " | الإجمالي: " + tot + " ج.م\n------------------------------\nيرجى تأكيد الطلب وتحديد عنوان التوصيل.";
                    window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg), "_blank");
                }
            });

            // إعادة رسم الصفحة عند تغيير اللغة من الزر
            var originalSetLanguage = window.setLanguage;
            window.setLanguage = function (l) {
                originalSetLanguage(l);
                if (rendered) render();
            };

            document.addEventListener("DOMContentLoaded", function () {
                render();
                rendered = true;
            });
        })();
    </script>
</body>
</html>
